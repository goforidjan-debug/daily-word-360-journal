<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0e2417" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Daily Word 360" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <!-- One canonical icon set: the gold Daily Word 360 logo, declared once
         per role as real PNG files (favicon 192/512, apple-touch-icon 180,
         and the web app manifest icons). Declaring each role twice — an
         inlined copy plus a file — makes some browsers/app webviews give
         up on the page icon and fall back to a generic one, so there
         must be exactly one declaration per role. -->
    
    
    
    
    <title>Daily Word 360 Journal</title>
    <style>
      :root {
        /* The printed journal's palette: deep green and gold on cream. */
        --surface: #fffdf7;
        --surface-alt: #f6f2e7;
        --header-surface: #fdfaf2;
        --text: #26332c;
        --header-text: #f3eedd;
        --dim: #5c6b61;
        --header-dim: #c3cdb9;
        --border: #e4dcc4;
        --accent: #1f4d3f;
        --gold: #b9975b;
        --gold-deep: #a07d2c;
        --radius: 10px;
        /* Two-tone green silk: the journal green and a darker green folded
           together in soft diagonal bands, like light across woven silk. */
        --silk-bg:
          radial-gradient(130% 80% at 12% -10%, rgba(84, 150, 118, 0.32), transparent 55%),
          radial-gradient(120% 90% at 105% 110%, rgba(0, 0, 0, 0.48), transparent 62%),
          repeating-linear-gradient(
            118deg,
            rgba(255, 255, 255, 0.045) 0,
            rgba(255, 255, 255, 0.045) 70px,
            rgba(0, 0, 0, 0.13) 130px,
            rgba(255, 255, 255, 0.02) 200px,
            rgba(0, 0, 0, 0.08) 280px
          ),
          linear-gradient(165deg, #20503a 0%, #143527 48%, #081a10 100%);
      }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background-color: #0e2417;
        background-image: var(--silk-bg);
        background-attachment: fixed;
        animation: silk-drift 26s ease-in-out infinite alternate;
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }
      @keyframes silk-drift {
        from { background-position: 0 0, 0 0, 0 0, 0 0; }
        to { background-position: 0 0, 0 0, 280px 0, 0 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        body { animation: none; }
      }
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2.25rem; }
      button { font: inherit; cursor: pointer; background: none; border: none; color: inherit; }
      input, textarea { font: inherit; }
      .font-journal { font-family: Georgia, "Times New Roman", serif; }

      .wrap { max-width: 42rem; margin: 0 auto; padding: 1rem 1rem 11rem; }

      /* Header */
      .hdr { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; padding-bottom: 0.5rem; }
      .hdr-date { font-size: 1.5rem; line-height: 1.25; color: var(--gold); margin: 0; }
      .hdr-clock-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.25rem 0.75rem; margin-top: 0.25rem; }
      .hdr-clock { font-size: 2.25rem; line-height: 1.1; color: var(--header-text); }
      .hdr-phase { font-size: 1rem; color: var(--header-dim); }
      .hdr-rhythm { margin: 0.5rem 0 0; font-size: 0.875rem; color: var(--header-dim); }
      .hdr-rhythm .on { font-weight: 600; color: var(--header-text); }

      /* The logo: a band of light sweeps across it on a gentle loop, and
         the gold brightens as the light passes over it. */
      .logo-shine { position: relative; flex: none; width: 4rem; height: 4rem; overflow: hidden; border-radius: 8px; border: 1px solid var(--gold); margin: 0; }
      @media (min-width: 640px) { .logo-shine { width: 5rem; height: 5rem; } }
      .logo-shine img { width: 100%; height: 100%; object-fit: cover; display: block; animation: logo-gold-glow 6s ease-in-out infinite; }
      .logo-shine::after {
        content: ""; position: absolute; inset: 0;
        background: linear-gradient(115deg, transparent 32%, rgba(255,236,180,0.35) 45%, rgba(255,250,225,0.75) 50%, rgba(255,236,180,0.35) 55%, transparent 68%);
        transform: translateX(-130%); mix-blend-mode: screen; pointer-events: none;
        animation: logo-light-pass 6s ease-in-out infinite;
      }
      @keyframes logo-light-pass { 0% { transform: translateX(-130%); } 30%, 100% { transform: translateX(130%); } }
      @keyframes logo-gold-glow { 0%, 100% { filter: brightness(1); } 15% { filter: brightness(1.35) saturate(1.15); } }
      @media (prefers-reduced-motion: reduce) {
        .logo-shine::after, .logo-shine img { animation: none; }
      }

      .day-nav { display: flex; align-items: center; justify-content: space-between; margin-top: 0.75rem; }
      .viewing-note { display: flex; align-items: center; gap: 0.75rem; margin-top: 0.75rem; font-size: 0.875rem; color: var(--header-dim); }

      .pill-btn {
        border: 1px solid var(--border); border-radius: 999px; padding: 0.25rem 1rem;
        font-size: 1rem; color: var(--accent); background: var(--surface);
      }
      .pill-btn.on-dark { background: transparent; color: var(--header-text); border-color: rgba(228,220,196,0.55); }
      .pill-btn.gold-outline { border-color: var(--gold); font-weight: 600; font-size: 0.875rem; padding: 0.25rem 0.75rem; }
      .cta-btn {
        border-radius: 999px; background: var(--accent); color: var(--header-surface);
        padding: 0.5rem 1.25rem; font-size: 0.875rem; font-weight: 600;
      }
      .cta-btn:disabled { opacity: 0.5; }

      /* Cards and sections */
      .card {
        background: var(--surface); border: 1px solid var(--border);
        border-radius: var(--radius); padding: 1rem; margin-bottom: 1.25rem;
      }
      .card.active { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
      .card h2, .sec h2, .sec h3 { color: var(--accent); margin: 0; }
      .sec { margin-bottom: 2rem; }
      .sec-title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; }
      .sec-time { font-size: 0.875rem; color: var(--dim); display: flex; align-items: center; gap: 0.5rem; }
      .now-badge { background: var(--gold); color: #26332c; border-radius: 999px; padding: 0.125rem 0.5rem; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
      .gold-rule { width: 52px; border: none; border-top: 2px solid var(--gold); margin: 0.75rem 0; }
      .label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: var(--gold-deep); margin: 0; }
      .stack > * + * { margin-top: 1rem; }
      .body-text { font-size: 1rem; line-height: 1.6; color: var(--text); margin: 0; }
      .dim-text { font-size: 1rem; line-height: 1.6; color: var(--dim); margin: 0; }
      .small-dim { font-size: 0.875rem; color: var(--dim); margin: 0; }

      .verse {
        background: var(--surface-alt); border: 1px solid var(--border);
        border-radius: var(--radius); padding: 0.75rem 1rem; margin: 0;
      }
      .verse blockquote { margin: 0; font-size: 1.125rem; font-style: italic; line-height: 1.6; color: var(--accent); }
      .verse figcaption { margin-top: 0.5rem; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--gold-deep); }

      textarea.journal, input.journal, input.line-input {
        width: 100%; box-sizing: border-box; margin-top: 0.25rem;
        border: 1px solid var(--border); border-radius: var(--radius);
        background: var(--surface); color: var(--text);
        padding: 5px 0.75rem; font-size: 1rem;
      }
      textarea.journal {
        resize: vertical; line-height: 28px;
        background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 27px, rgba(185,151,91,0.28) 27px, rgba(185,151,91,0.28) 28px);
      }
      input.line-input { padding: 0.5rem 0.75rem; }
      textarea.journal::placeholder { color: var(--dim); }
      .field { margin: 0; }

      .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
      .chip {
        border: 1px solid var(--border); border-radius: 999px; padding: 0.25rem 0.75rem;
        font-size: 0.875rem; color: var(--dim); background: var(--surface); min-height: 2.25rem;
      }
      .chip.sel { border-color: var(--gold); background: #e9efe7; font-weight: 600; color: var(--accent); }

      .prompt-big { font-size: 1.5rem; line-height: 1.35; color: var(--text); margin: 0.25rem 0 0; }
      .midday-line { font-size: 1.125rem; font-style: italic; line-height: 1.6; color: var(--text); margin: 0; }

      /* 30 prompts list */
      .prompt-list { list-style: none; margin: 0.75rem 0 0; padding: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
      .prompt-list li + li { border-top: 1px solid var(--border); }
      .prompt-list button {
        display: flex; width: 100%; align-items: baseline; gap: 0.75rem;
        padding: 0.5rem 0.75rem; text-align: left; font-size: 1rem; color: var(--text);
      }
      .prompt-list button.current { background: #e9efe7; }
      .prompt-list .n { font-family: Georgia, "Times New Roman", serif; width: 1.75rem; flex: none; font-size: 1.125rem; font-weight: 700; color: var(--accent); }
      .prompt-list button.current .n { color: var(--gold-deep); }
      .prompt-list button:disabled { cursor: default; }

      /* Calendar */
      .cal-head { display: flex; align-items: center; justify-content: space-between; }
      .cal-head h2 { font-size: 1.5rem; color: var(--header-text); margin: 0; }
      .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.25rem; text-align: center; margin-top: 1rem; }
      .cal-dow { padding: 0.25rem 0; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--header-dim); }
      .cal-cell {
        position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
        min-height: 3rem; padding: 0.25rem 0; border-radius: var(--radius);
        border: 1px solid transparent; color: var(--header-text); font-size: 1rem;
        background: rgba(255, 253, 247, 0.07);
      }
      .cal-cell.out { opacity: 0.45; }
      .cal-cell.sel { border-color: var(--gold); background: rgba(255, 253, 247, 0.2); }
      .cal-cell .today-num { font-weight: 700; color: var(--gold); }
      .cal-cell.written { background: rgba(185, 151, 91, 0.32); border-color: rgba(185, 151, 91, 0.55); }
      .cal-cell.written.sel { background: rgba(185, 151, 91, 0.45); }
      .cal-prayed { margin-top: 1px; font-size: 0.5rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); line-height: 1; }

      /* New features: verse hero, streak, timer, PIN, cards, music, export */
      .verse-hero { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem 1rem; margin-bottom: 1.25rem; text-align: center; }
      .verse-hero blockquote { margin: 0; font-size: 1.5rem; line-height: 1.45; color: var(--accent); font-style: italic; }
      .verse-hero figcaption { margin-top: 0.75rem; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--gold-deep); }
      .streak-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.25rem 0.75rem; margin-bottom: 1rem; }
      .streak-pill { background: rgba(185, 151, 91, 0.25); border: 1px solid rgba(185, 151, 91, 0.6); color: var(--header-text); border-radius: 999px; padding: 0.25rem 0.75rem; font-size: 0.875rem; font-weight: 600; white-space: nowrap; }
      .streak-nudge { font-size: 0.875rem; color: var(--header-dim); margin: 0; }
      .timer-display { font-size: 2.5rem; line-height: 1.1; text-align: center; color: var(--accent); margin: 0.5rem 0; font-variant-numeric: tabular-nums; }
      .timer-row { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; margin-top: 0.75rem; }
      .pin-input { width: 10rem; text-align: center; font-size: 1.25rem; letter-spacing: 0.4em; }
      .lock-shake { animation: lock-shake 0.3s; }
      @keyframes lock-shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
      #lock-screen { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; padding: 2rem; background-color: #0e2417; background-image: var(--silk-bg); color: var(--header-text); text-align: center; }
      #lock-screen input { width: 10rem; text-align: center; font-size: 1.5rem; letter-spacing: 0.5em; padding: 0.5rem; border-radius: var(--radius); border: 1px solid var(--gold); background: var(--surface); color: var(--text); }
      .music-bar { position: fixed; left: 0; right: 0; z-index: 9; background: var(--surface); border-top: 1px solid var(--border); }
      .music-bar .inner { max-width: 42rem; margin: 0 auto; display: flex; align-items: center; gap: 0.5rem; padding: 0.375rem 0.75rem; }
      .music-bar .track-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.875rem; color: var(--text); background: none; border: none; text-align: left; padding: 0; }
      .music-btn { border: 1px solid var(--border); border-radius: 999px; width: 2.25rem; height: 2.25rem; min-height: 2.25rem; display: flex; align-items: center; justify-content: center; font-size: 1rem; color: var(--accent); background: var(--surface); flex: none; padding: 0; }
      .music-bar input[type="range"] { width: 4.5rem; flex: none; accent-color: var(--accent); }
      .modal { position: fixed; inset: 0; z-index: 60; background: rgba(8, 26, 16, 0.88); display: flex; align-items: center; justify-content: center; padding: 1rem; }
      .modal .modal-card { background: var(--surface); border-radius: var(--radius); padding: 1rem; max-width: 30rem; width: 100%; text-align: center; max-height: 92vh; overflow-y: auto; }
      .modal img { width: 100%; border-radius: 8px; display: block; }
      #print-export { display: none; }
      body.printing #print-export { display: block; }
      @media print {
        body.printing header, body.printing #view, body.printing nav.tabs, body.printing .music-bar, body.printing #lock-screen { display: none !important; }
        body.printing #print-export { display: block !important; }
      }

      /* Tracker cards */
      .item-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; margin-bottom: 0.75rem; }
      .item-card .big { font-size: 1.125rem; line-height: 1.55; color: var(--text); margin: 0; }
      .link-btn { padding: 0.25rem 0.5rem; font-size: 0.875rem; color: var(--accent); text-decoration: underline; min-height: 2.25rem; }
      .link-btn.dim { color: var(--dim); }
      .danger-btn { padding: 0.25rem 0.5rem; font-size: 0.875rem; font-weight: 600; color: #b3261e; }
      details.record-answer summary { cursor: pointer; font-size: 0.875rem; font-weight: 600; color: var(--accent); padding: 0.5rem 0; }
      .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; margin: 1rem 0; }
      .row-actions { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.75rem; flex-wrap: wrap; }
      input[type="date"].journal { width: auto; }

      .begin-banner { border-color: var(--gold); background: var(--surface-alt); }

      /* Bottom nav */
      nav.tabs {
        position: fixed; inset-inline: 0; bottom: 0; z-index: 10;
        border-top: 1px solid var(--border); background: var(--surface);
        padding-bottom: env(safe-area-inset-bottom);
      }
      nav.tabs .inner { max-width: 42rem; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
      nav.tabs button { padding: 0.75rem 0; font-size: 0.875rem; color: var(--dim); min-height: 3rem; }
      nav.tabs button[aria-current="page"] { font-weight: 700; color: var(--accent); text-decoration: underline; text-decoration-color: var(--gold); text-decoration-thickness: 2px; text-underline-offset: 4px; }

      .week-nav { display: flex; align-items: center; justify-content: space-between; }
      .week-nav h2 { font-size: 1.5rem; color: var(--header-text); margin: 0; text-align: center; }
      .week-nav .sub { font-size: 0.875rem; color: var(--header-dim); text-align: center; margin: 0.25rem 0 0; }
      .on-dark-title { color: var(--header-text) !important; }
      .on-dark-dim { color: var(--header-dim) !important; }
    </style>
  </head>
  <body>

        <div class="hdr">
          <div>
            <p class="hdr-date font-journal" id="hdr-date"></p>
            <div class="hdr-clock-row">
              <span class="hdr-clock font-journal" id="hdr-clock"></span>
              <span class="hdr-phase" id="hdr-phase"></span>
            </div>
            <p class="hdr-rhythm" id="hdr-rhythm"></p>
          </div>

      var CLOSING_BLESSING = "May the God of hope fill you with all joy and peace as you trust in Him.";
      var CLOSING_REF = "After Romans 15:13 (NIV)";
      var WEEKDAY_FULL = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];

      /* ============ date helpers (local time) ============ */
      function pad(n) { return String(n).padStart(2, "0"); }
      function dateKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
      function parseKey(k) { return new Date(k + "T00:00:00"); }
      function todayKey() { return dateKey(new Date()); }
      function addDays(k, n) { var d = parseKey(k); d.setDate(d.getDate() + n); return dateKey(d); }
      function diffDays(a, b) { return Math.round((parseKey(b) - parseKey(a)) / 86400000); }
      function cycleDayFor(date, start) { var diff = diffDays(start, date); return ((diff % 30) + 30) % 30 + 1; }
      function mondayOf(k) { var d = parseKey(k); var back = (d.getDay() + 6) % 7; d.setDate(d.getDate() - back); return dateKey(d); }
      function formatLong(k) { return parseKey(k).toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" }); }
      function formatShort(k) { return parseKey(k).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }); }
      function formatMonthYear(y, m) { return new Date(y, m, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" }); }
      function dayIndexOfYear(k) { return diffDays(k.slice(0, 4) + "-01-01", k); }
      function phaseForHour(h) { return h < 12 ? "morning" : h < 17 ? "midday" : "evening"; }

      function esc(s) {
        return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      /* ============ saved state: entries save on this device
         (localStorage), so they are still here when you come back ============ */
      var EMPTY_DAY = { verseRef: null, thanksgiving: "", requests: "", peopleOnHeart: "", listening: "", oneStep: "", eveningBest: "", eveningHardest: "", eveningHandBack: "", eveningPrayer: "" };
      var EMPTY_WEEK = { thankful: "", answers: "", teaching: "", waiting: "", nextWeekPrayer: "" };
      var state = {
        tab: "today",
        selectedDate: todayKey(),
        followToday: true,
        cycleStart: null,
        days: {},        // date -> day form
        gratitude: {},   // date -> {item1,item2,item3}
        weeks: {},       // weekStart -> week form
        answered: [],    // {id, prayer, datePrayed, howAnswered, dateAnswered}
        people: [],      // {id, name, request, sinceDate}
        focus: { seasonPrayer: "", myself: "", family: "", work: "", others: "" },
        notes: "",
        calCursor: null, // {y, m}
        weekStart: null,
        nextId: 1,
        settings: { pinHash: null, musicTrack: 0, musicVolume: 40 }
      };
      var sel = parseKey(state.selectedDate);
      state.calCursor = { y: sel.getFullYear(), m: sel.getMonth() };
      state.weekStart = mondayOf(state.selectedDate);

      /* ---- save + load: everything written here is kept on the
         buyer's own device (localStorage, same origin as this page),
         so it survives closing the app and coming back. No account,
         no server, nothing leaves the device. ---- */
      var STORE_KEY = "dw360-journal-v1";
      function saveJournal() {
        try {
          var data = {
            v: 1,
            cycleStart: state.cycleStart,
            days: state.days,
            gratitude: state.gratitude,
            weeks: state.weeks,
            answered: state.answered,
            people: state.people,
            focus: state.focus,
            notes: state.notes,
            nextId: state.nextId,
            settings: state.settings
          };
          localStorage.setItem(STORE_KEY, JSON.stringify(data));
        } catch (e) { /* private mode / storage full: keep working in memory */ }
      }
      function loadJournal() {
        try {
          var raw = localStorage.getItem(STORE_KEY);
          if (!raw) return;
          var data = JSON.parse(raw);
          if (!data || typeof data !== "object") return;
          if (data.cycleStart) state.cycleStart = data.cycleStart;
          if (data.days) state.days = data.days;
          if (data.gratitude) state.gratitude = data.gratitude;
          if (data.weeks) state.weeks = data.weeks;
          if (Array.isArray(data.answered)) state.answered = data.answered;
          if (Array.isArray(data.people)) state.people = data.people;
          if (data.focus) state.focus = Object.assign(state.focus, data.focus);
          if (typeof data.notes === "string") state.notes = data.notes;
          if (data.settings) state.settings = Object.assign({ pinHash: null, musicTrack: 0, musicVolume: 40 }, data.settings);
          var maxId = 0;
          state.answered.concat(state.people).forEach(function (x) { if (x && x.id > maxId) maxId = x.id; });
          state.nextId = Math.max(data.nextId || 1, maxId + 1);
        } catch (e) { /* corrupted or unavailable storage: start fresh */ }
      }
      loadJournal();

      function dayForm(date) {
        if (!state.days[date]) state.days[date] = Object.assign({}, EMPTY_DAY);
        return state.days[date];
      }
      function gratForm(date) {
        if (!state.gratitude[date]) state.gratitude[date] = { item1: "", item2: "", item3: "" };
        return state.gratitude[date];
      }
      function weekForm(ws) {
        if (!state.weeks[ws]) state.weeks[ws] = Object.assign({}, EMPTY_WEEK);
        return state.weeks[ws];
      }
      function hasWriting(date) {
        var f = state.days[date];
        if (f) { for (var k in f) { if (k !== "verseRef" && f[k]) return true; } }
        var g = state.gratitude[date];
        if (g && (g.item1 || g.item2 || g.item3)) return true;
        return false;
      }

      /* ============ new features: streak, timer, PIN, cards, music, export ============ */
      function prayerStreak() {
        var count = 0;
        var d = todayKey();
        if (!hasWriting(d)) d = addDays(d, -1);
        while (hasWriting(d)) { count++; d = addDays(d, -1); }
        return count;
      }

      /* ---- prayer timer (module-level so it survives re-renders) ---- */
      var timerTotal = 600, timerLeft = 600, timerRunning = false, timerInt = null;
      function timerText(s) { var m = Math.floor(s / 60), r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }
      function updateTimerDisplay() {
        var el = document.getElementById("timer-display");
        if (el) el.textContent = timerText(timerLeft);
        var btn = document.getElementById("timer-start");
        if (btn) btn.textContent = timerRunning ? "Pause" : (timerLeft < timerTotal ? "Resume" : "Start");
      }
      function timerTick() {
        if (timerLeft > 0) {
          timerLeft--;
          updateTimerDisplay();
          if (timerLeft === 0) { stopTimer(); chime(); }
        }
      }
      function startTimer() {
        if (timerRunning) return;
        if (timerLeft <= 0) timerLeft = timerTotal;
        timerRunning = true;
        timerInt = setInterval(timerTick, 1000);
        updateTimerDisplay();
      }
      function stopTimer() {
        timerRunning = false;
        if (timerInt) { clearInterval(timerInt); timerInt = null; }
        updateTimerDisplay();
      }
      function chime() {
        try {
          var AC = window.AudioContext || window.webkitAudioContext;
          var ctx = new AC();
          [523.25, 783.99].forEach(function (freq, i) {
            var o = ctx.createOscillator(), g = ctx.createGain();
            var t0 = ctx.currentTime + i * 0.7;
            o.frequency.value = freq; o.type = "sine";
            g.gain.setValueAtTime(0.0001, t0);
            g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.05);
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.4);
            o.connect(g); g.connect(ctx.destination);
            o.start(t0); o.stop(t0 + 1.5);
          });
        } catch (e) { /* no audio support: the timer still ends silently */ }
      }

      /* ---- PIN lock (a privacy screen, not encryption: it keeps casual
         eyes out. The PIN lives only on this phone, as a hash.) ---- */
      var sessionUnlocked = false;
      var pinNotice = "";
      function pinHash(pin) {
        var h = 5381, str = "dw360-pin:" + pin;
        for (var i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0;
        return String(h);

      /* ---- shareable prayer cards (1080x1350 canvas) ---- */
      function wrapCanvasText(ctx, text, maxWidth) {
        var words = String(text).split(/\s+/);
        var lines = [], line = "";
        words.forEach(function (w) {
          var t = line ? line + " " + w : w;
          if (ctx.measureText(t).width > maxWidth && line) { lines.push(line); line = w; }
          else line = t;
        });
        if (line) lines.push(line);
        return lines;
      }
      function drawPrayerCard(opts) {
        var W = 1080, H = 1350;
        var cv = document.createElement("canvas");
        cv.width = W; cv.height = H;
        var ctx = cv.getContext("2d");
        var g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, "#20503a"); g.addColorStop(0.55, "#143527"); g.addColorStop(1, "#081a10");
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        ctx.strokeStyle = "#b9975b"; ctx.lineWidth = 4; ctx.strokeRect(48, 48, W - 96, H - 96);
        ctx.lineWidth = 1.5; ctx.strokeRect(64, 64, W - 128, H - 128);
        ctx.textAlign = "center";
        var logo = document.querySelector(".logo-shine img");
        var y = 170;
        if (logo && logo.complete && logo.naturalWidth) {
          try { ctx.drawImage(logo, W / 2 - 60, 110, 120, 120); y = 270; } catch (e) {}
        }
        ctx.fillStyle = "#b9975b";
        ctx.font = "700 34px Georgia, serif";
        ctx.fillText("D A I L Y   W O R D   3 6 0", W / 2, y + 10);
        var size = 64, lines = [];
        while (size >= 38) {
          ctx.font = (opts.italic ? "italic " : "") + size + "px Georgia, serif";
          lines = wrapCanvasText(ctx, opts.body, W - 220);
          if (lines.length <= 8) break;
          size -= 6;
        }
        ctx.fillStyle = "#f3eedd";
        var lh = Math.round(size * 1.45);
        var startY = 560 - ((lines.length - 1) * lh) / 2;
        lines.forEach(function (ln, i) { ctx.fillText(ln, W / 2, startY + i * lh); });
        var refY = startY + lines.length * lh + 60;
        ctx.fillStyle = "#b9975b";
        ctx.font = "700 34px Georgia, serif";
        ctx.fillText(opts.ref, W / 2, refY);
        ctx.font = "28px Georgia, serif";
        ctx.fillStyle = "#c3cdb9";
        ctx.fillText("30-Day Prayer Journal", W / 2, H - 150);
        ctx.fillText("dailyverse.gumroad.com/l/hfuap", W / 2, H - 105);
        return cv;
      }

      function wireMusicBar() {

        function positionBar() {
          var nav = document.querySelector("nav.tabs");

        }
        function loadTrack(i, autoplay) {
          var n = MUSIC_TRACKS.length;
          var idx = ((i % n) + n) % n;
          state.settings.musicTrack = idx;
          audioEl.src = MUSIC_TRACKS[idx].file;
          nameBtn.textContent = MUSIC_TRACKS[idx].title;
          saveJournal();
          if (autoplay) playAudio();

        function playAudio() {
          var p = audioEl.play();

        }

          audioEl.pause();

          playBtn.setAttribute("aria-label", "Play music");
        }
        audioEl.volume = (state.settings.musicVolume || 40) / 100;
        vol.value = state.settings.musicVolume || 40;

          state.settings.musicVolume = Number(vol.value);

          saveJournal();
        });
        playBtn.addEventListener("click", function () {
          if (audioEl.paused) { if (!audioEl.getAttribute("src")) loadTrack(state.settings.musicTrack || 0, false); playAudio(); }
          else pauseAudio();
        });
        function nextTrack() {
          var wasPlaying = !audioEl.paused;
          loadTrack((state.settings.musicTrack || 0) + 1, wasPlaying);
        }

        nameBtn.addEventListener("click", nextTrack);

          loadTrack((state.settings.musicTrack || 0) + 1, true);

        bar.hidden = false;
        positionBar();
        window.addEventListener("resize", positionBar);
      }

        });
        bindField("f-thanksgiving", form, "thanksgiving");
        bindField("f-requests", form, "requests");
        bindField("f-peopleOnHeart", form, "peopleOnHeart");
        bindField("f-listening", form, "listening");
        bindField("f-oneStep", form, "oneStep");
        bindField("f-eveningBest", form, "eveningBest");
        bindField("f-eveningHardest", form, "eveningHardest");
        bindField("f-eveningHandBack", form, "eveningHandBack");
        bindField("f-eveningPrayer", form, "eveningPrayer");
        ["item1", "item2", "item3"].forEach(function (k) { bindField("g-" + k, grat, k); });
        view.querySelectorAll("[data-prompt-day]").forEach(function (b) {
          b.addEventListener("click", function () {
            if (cycleDay == null) return;
            pickDate(addDays(date, Number(b.getAttribute("data-prompt-day")) - cycleDay), false);
          });
        });
        document.getElementById("download-day").addEventListener("click", function () { downloadDay(date); });
        document.getElementById("download-backup").addEventListener("click", function () { downloadBackup(); });
        document.getElementById("share-verse-card").addEventListener("click", function () { shareVerseCard(date); });
        document.getElementById("share-prayer-card").addEventListener("click", function () { sharePrayerCard(date); });
        document.getElementById("export-journal").addEventListener("click", function () { exportJournal(); });
        view.querySelectorAll("[data-timer-min]").forEach(function (b) {
          b.addEventListener("click", function () {
            stopTimer();
            timerTotal = Number(b.getAttribute("data-timer-min")) * 60;
            timerLeft = timerTotal;
            renderToday();
          });
        });
        document.getElementById("timer-start").addEventListener("click", function () {
          if (timerRunning) stopTimer(); else startTimer();
        });
        document.getElementById("timer-reset").addEventListener("click", function () {
          stopTimer(); timerLeft = timerTotal; renderToday();
        });
        updateTimerDisplay();
        saveJournal();
      }

      function downloadBackup() {
        saveJournal();
        var blob = new Blob([localStorage.getItem(STORE_KEY) || "{}"], { type: "application/json" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "daily-word-360-journal-backup.json";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
      }

      function downloadDay(date) {
        var form = dayForm(date);
        var grat = gratForm(date);
        var cycleDay = state.cycleStart ? cycleDayFor(date, state.cycleStart) : null;
        var di = dayIndexOfYear(date);
        var chosen = VERSES.find(function (v) { return v.ref === form.verseRef; }) || VERSES[di % VERSES.length];
        var lines = [];
        lines.push("Daily Word 360 Journal — " + formatLong(date));
        lines.push("");
        if (cycleDay != null) { lines.push("Day " + cycleDay + " of 30: " + PROMPTS[cycleDay - 1]); lines.push(""); }
        lines.push("Scripture: \"" + chosen.text + "\" — " + chosen.ref + " (NIV)");
        lines.push("");
        function add(lab, val) { if (val) { lines.push(lab + ":"); lines.push(val); lines.push(""); } }
        add("Lord, today I thank You for", form.thanksgiving);
        add("I bring these requests to You", form.requests);
        add("People on my heart today", form.peopleOnHeart);
        add("Listening — what I sense God saying", form.listening);
        add("One step I will take today", form.oneStep);
        var g = [grat.item1, grat.item2, grat.item3].filter(Boolean);
        if (g.length) { lines.push("Three things I am grateful for:"); g.forEach(function (x) { lines.push("- " + x); }); lines.push(""); }
        add("The best moment of today", form.eveningBest);
        add("The hardest moment of today", form.eveningHardest);
        add("Tonight I hand back to You", form.eveningHandBack);
        if (form.eveningPrayer) { lines.push("My prayer tonight:"); lines.push("Heavenly Father,"); lines.push(form.eveningPrayer); lines.push("Amen."); lines.push(""); }
        var blob = new Blob([lines.join("\n")], { type: "text/plain" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "daily-word-360-journal-" + date + ".txt";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
      }

      /* ============ Calendar tab ============ */
      function renderCalendar() {
        var cur = state.calCursor;
        var gridStartDate = mondayOf(dateKey(new Date(cur.y, cur.m, 1)));
        var cells = [];
        for (var i = 0; i < 42; i++) cells.push(addDays(gridStartDate, i));
        var today = todayKey();
        var selCycle = state.cycleStart ? cycleDayFor(state.selectedDate, state.cycleStart) : null;
        var selPrompt = selCycle != null ? PROMPTS[selCycle - 1] : null;

        var html = '<div class="cal-head">' +
          '<button type="button" class="pill-btn on-dark" id="cal-prev" aria-label="Previous month">&#8249;</button>' +
          '<h2 class="font-journal">' + esc(formatMonthYear(cur.y, cur.m)) + "</h2>" +
          '<button type="button" class="pill-btn on-dark" id="cal-next" aria-label="Next month">&#8250;</button></div>';
        html += '<p class="dim-text" style="margin:0.5rem 0 0">Days shaded gold and marked PRAYED are days you wrote in — tap any date, then "Open this day", to read it again.</p>';
        html += '<div class="cal-grid">' +
          ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map(function (d) { return '<div class="cal-dow">' + d + "</div>"; }).join("") +
          cells.map(function (k) {
            var d = parseKey(k);
            var inMonth = d.getMonth() === cur.m;
            var isSel = k === state.selectedDate;
            var isToday = k === today;
            return '<button type="button" class="cal-cell' + (inMonth ? "" : " out") + (isSel ? " sel" : "") + (hasWriting(k) ? " written" : "") + '" data-date="' + k + '" aria-label="' + esc(formatLong(k)) + (hasWriting(k) ? " — prayed" : "") + '" aria-pressed="' + isSel + '">' +
              '<span class="' + (isToday ? "today-num" : "") + '">' + d.getDate() + "</span>" +
              (hasWriting(k) ? '<span class="cal-prayed" aria-hidden="true">Prayed</span>' : "") + "</button>";
          }).join("") + "</div>";

        html += '<section class="card" style="margin-top:1.25rem" aria-label="Selected day summary">' + label(formatShort(state.selectedDate)) +
          '<p class="font-journal" style="font-size:1.25rem;color:var(--text);margin:0.25rem 0 0">' + esc(formatLong(state.selectedDate)) + "</p>" +
          (selCycle != null && selPrompt
            ? '<p class="dim-text" style="margin-top:0.5rem">Day ' + selCycle + " of 30 — " + esc(selPrompt) + "</p>"
            : '<p class="dim-text" style="margin-top:0.5rem">The 30-day journey is not set yet — begin it from the Focus page.</p>') +
          '<p class="dim-text">' + (hasWriting(state.selectedDate) ? "You have written in this day." : "Nothing written in this day yet.") + "</p>" +
          '<button type="button" class="cta-btn" id="cal-open" style="margin-top:0.75rem">Open this day</button></section>';

        view.innerHTML = html;
        document.getElementById("cal-prev").addEventListener("click", function () { moveCal(-1); });
        document.getElementById("cal-next").addEventListener("click", function () { moveCal(1); });
        view.querySelectorAll("[data-date]").forEach(function (b) {
          b.addEventListener("click", function () {
            state.selectedDate = b.getAttribute("data-date");
            state.followToday = state.selectedDate === todayKey();
            renderCalendar(); renderHeader();
          });
        });
        document.getElementById("cal-open").addEventListener("click", function () { pickDate(state.selectedDate, true); });
        saveJournal();
      }
      function moveCal(delta) {
        var d = new Date(state.calCursor.y, state.calCursor.m + delta, 1);
        state.calCursor = { y: d.getFullYear(), m: d.getMonth() };
        renderCalendar();
      }
    </script>
    <script>
      "use strict";
      /* ============ Prayers tab ============ */
      var editingAnswered = {}, editingPeople = {}, confirmRemove = {};

      function renderPrayers() {
        var html = "";

        /* Answered prayers */
        html += '<section class="sec" aria-label="Answered prayers">' +
          '<h2 class="font-journal on-dark-title" style="font-size:1.5rem">Answered Prayers</h2>' + goldRule() +
          '<p class="dim-text on-dark-dim">Every answered prayer is worth writing down. On a hard day, this page will remind you that God has heard you before — and He hears you still. An answer can be &ldquo;yes&rdquo;, &ldquo;not yet&rdquo;, or &ldquo;I have something better&rdquo; — all three are worth recording.</p>' +
          '<div class="form-card"><div class="stack">' +
          field("np-text", "Add a prayer", "", 2, "What are you praying about?") +
          '<div>' + label("Date prayed") + '<input type="date" class="journal" id="np-date" aria-label="Date prayed for the new prayer" value="' + todayKey() + '" /></div>' +
          '<div><button type="button" class="cta-btn" id="np-add">Add to tracker</button></div>' +
          "</div></div>" +
          '<div id="answered-list">' +
          (state.answered.length === 0
            ? '<p class="dim-text on-dark-dim">No prayers recorded yet. Add the first one above, and come back to write down how God answers.</p>'
            : state.answered.map(function (p) { return answeredCard(p); }).join("")) +
          "</div></section>";

        /* People */
        html += '<section class="sec" aria-label="People I am praying for">' +
          '<h2 class="font-journal on-dark-title" style="font-size:1.5rem">People I Am Praying For</h2>' + goldRule() +
          '<p class="dim-text on-dark-dim">Keep the names in front of you. Pray for one or two people each day, and note anything God does — for them, and in you as you pray.</p>' +
          '<div class="form-card"><div class="stack">' +
          '<div>' + label("Name") + '<input class="line-input" id="npe-name" aria-label="Name of the person to add" /></div>' +
          field("npe-request", "What I am praying", "", 2) +
          '<div>' + label("Praying since") + '<input type="date" class="journal" id="npe-since" aria-label="Praying since date for the new person" value="' + todayKey() + '" /></div>' +
          '<div><button type="button" class="cta-btn" id="npe-add">Add person</button></div>' +
          "</div></div>" +
          '<div id="people-list">' +
          (state.people.length === 0
            ? '<p class="dim-text on-dark-dim">No names yet. Add the first person you are carrying in prayer.</p>'
            : state.people.map(function (p) { return personCard(p); }).join("")) +
          "</div></section>";

        view.innerHTML = html;

        document.getElementById("np-add").addEventListener("click", function () {
          var t = document.getElementById("np-text").value.trim();
          var d = document.getElementById("np-date").value || todayKey();
          if (!t) return;
          state.answered.unshift({ id: state.nextId++, prayer: t, datePrayed: d, howAnswered: "", dateAnswered: null });
          renderPrayers();
        });
        document.getElementById("npe-add").addEventListener("click", function () {
          var n = document.getElementById("npe-name").value.trim();
          if (!n) return;
          state.people.unshift({ id: state.nextId++, name: n, request: document.getElementById("npe-request").value.trim(), sinceDate: document.getElementById("npe-since").value || todayKey() });
          renderPrayers();
        });
        wireAnsweredCards();
        wirePeopleCards();
        saveJournal();
      }

      function removeBtn(kind, id, text) {
        var key = kind + ":" + id;
        if (confirmRemove[key]) {
          return '<span style="display:inline-flex;gap:0.5rem;align-items:center">' +
            '<button type="button" class="danger-btn" data-confirm-remove="' + key + '">Confirm remove</button>' +
            '<button type="button" class="link-btn dim" data-keep="' + key + '">Keep</button></span>';
        }
        return '<button type="button" class="link-btn dim" data-remove="' + key + '" aria-label="' + esc(text) + '">Remove</button>';
      }

      function answeredCard(p) {
        if (editingAnswered[p.id]) {
          return '<article class="item-card"><div class="stack">' +
            field("ea-text-" + p.id, "My prayer", p.prayer, 3) +
            '<div>' + label("Date prayed") + '<input type="date" class="journal" id="ea-date-' + p.id + '" value="' + p.datePrayed + '" /></div>' +
            field("ea-how-" + p.id, "How God answered", p.howAnswered, 2) +
            '<div class="row-actions"><button type="button" class="cta-btn" data-save-answered="' + p.id + '">Save changes</button>' +
            '<button type="button" class="link-btn dim" data-cancel-answered="' + p.id + '">Cancel</button></div>' +
            "</div></article>";
        }
        var answered = p.dateAnswered != null;
        var inner = '<p class="big font-journal">' + esc(p.prayer) + "</p>" +
          '<p class="small-dim" style="margin-top:0.5rem">Prayed ' + esc(formatShort(p.datePrayed)) + "</p>";
        if (answered) {
          inner += '<p class="body-text" style="font-style:italic;margin-top:0.5rem">' + esc(p.howAnswered || "God answered.") + "</p>" +
            '<p class="small-dim">Answered ' + esc(formatShort(p.dateAnswered)) + "</p>";
        } else {
          inner += '<details class="record-answer"><summary>Record the answer</summary><div class="stack" style="margin-top:0.5rem">' +
            field("ra-how-" + p.id, "How God answered", p.howAnswered, 2) +
            '<div>' + label("Date answered") + '<input type="date" class="journal" id="ra-date-' + p.id + '" value="' + todayKey() + '" /></div>' +
            '<div><button type="button" class="cta-btn" data-mark-answered="' + p.id + '">Mark answered</button></div>' +
            "</div></details>";
        }
        inner += '<div class="row-actions"><button type="button" class="link-btn" data-edit-answered="' + p.id + '">Edit</button>' +
          removeBtn("answered", p.id, "Remove prayer: " + p.prayer.slice(0, 40)) + "</div>";
        return '<article class="item-card">' + inner + "</article>";
      }

      function wireAnsweredCards() {
        view.querySelectorAll("[data-edit-answered]").forEach(function (b) {
          b.addEventListener("click", function () { editingAnswered[b.getAttribute("data-edit-answered")] = true; renderPrayers(); });
        });
        view.querySelectorAll("[data-cancel-answered]").forEach(function (b) {
          b.addEventListener("click", function () { delete editingAnswered[b.getAttribute("data-cancel-answered")]; renderPrayers(); });
        });
        view.querySelectorAll("[data-save-answered]").forEach(function (b) {
          b.addEventListener("click", function () {
            var id = Number(b.getAttribute("data-save-answered"));
            var p = state.answered.find(function (x) { return x.id === id; });
            if (p) {
              p.prayer = document.getElementById("ea-text-" + id).value;
              p.datePrayed = document.getElementById("ea-date-" + id).value || p.datePrayed;
              p.howAnswered = document.getElementById("ea-how-" + id).value;
            }
            delete editingAnswered[id]; renderPrayers();
          });
        });
        view.querySelectorAll("[data-mark-answered]").forEach(function (b) {
          b.addEventListener("click", function () {
            var id = Number(b.getAttribute("data-mark-answered"));
            var p = state.answered.find(function (x) { return x.id === id; });
            if (p) {
              p.howAnswered = document.getElementById("ra-how-" + id).value;
              p.dateAnswered = document.getElementById("ra-date-" + id).value || todayKey();
            }
            renderPrayers();
          });
        });
        wireRemove("answered");
      }

      function personCard(p) {
        if (editingPeople[p.id]) {
          return '<article class="item-card"><div class="stack">' +
            '<div>' + label("Name") + '<input class="line-input" id="ep-name-' + p.id + '" value="' + esc(p.name) + '" /></div>' +
            field("ep-request-" + p.id, "What I am praying", p.request, 2) +
            '<div>' + label("Praying since") + '<input type="date" class="journal" id="ep-since-' + p.id + '" value="' + p.sinceDate + '" /></div>' +
            '<div class="row-actions"><button type="button" class="cta-btn" data-save-person="' + p.id + '">Save changes</button>' +
            '<button type="button" class="link-btn dim" data-cancel-person="' + p.id + '">Cancel</button></div>' +
            "</div></article>";
        }
        return '<article class="item-card"><p class="big font-journal">' + esc(p.name) + "</p>" +
          (p.request ? '<p class="body-text" style="margin-top:0.25rem">' + esc(p.request) + "</p>" : "") +
          '<p class="small-dim" style="margin-top:0.25rem">Praying since ' + esc(formatShort(p.sinceDate)) + "</p>" +
          '<div class="row-actions"><button type="button" class="link-btn" data-edit-person="' + p.id + '">Edit</button>' +
          removeBtn("people", p.id, "Remove " + p.name + " from the praying-for list") + "</div></article>";
      }

      function wirePeopleCards() {
        view.querySelectorAll("[data-edit-person]").forEach(function (b) {
          b.addEventListener("click", function () { editingPeople[b.getAttribute("data-edit-person")] = true; renderPrayers(); });
        });
        view.querySelectorAll("[data-cancel-person]").forEach(function (b) {
          b.addEventListener("click", function () { delete editingPeople[b.getAttribute("data-cancel-person")]; renderPrayers(); });
        });
        view.querySelectorAll("[data-save-person]").forEach(function (b) {
          b.addEventListener("click", function () {
            var id = Number(b.getAttribute("data-save-person"));
            var p = state.people.find(function (x) { return x.id === id; });
            if (p) {
              var n = document.getElementById("ep-name-" + id).value.trim();
              if (n) p.name = n;
              p.request = document.getElementById("ep-request-" + id).value;
              p.sinceDate = document.getElementById("ep-since-" + id).value || p.sinceDate;
            }
            delete editingPeople[id]; renderPrayers();
          });
        });
        wireRemove("people");
      }

      function wireRemove(kind) {
        view.querySelectorAll('[data-remove^="' + kind + ':"]').forEach(function (b) {
          b.addEventListener("click", function () { confirmRemove[b.getAttribute("data-remove")] = true; renderPrayers(); });
        });
        view.querySelectorAll('[data-keep^="' + kind + ':"]').forEach(function (b) {
          b.addEventListener("click", function () { delete confirmRemove[b.getAttribute("data-keep")]; renderPrayers(); });
        });
        view.querySelectorAll('[data-confirm-remove^="' + kind + ':"]').forEach(function (b) {
          b.addEventListener("click", function () {
            var id = Number(b.getAttribute("data-confirm-remove").split(":")[1]);
            if (kind === "answered") state.answered = state.answered.filter(function (x) { return x.id !== id; });
            else state.people = state.people.filter(function (x) { return x.id !== id; });
            delete confirmRemove[kind + ":" + id];
            renderPrayers();
          });
        });
      }

      /* ============ Weekly tab ============ */
      function renderWeekly() {
        var ws = state.weekStart;
        var form = weekForm(ws);
        var days = [];
        for (var i = 0; i < 7; i++) days.push(addDays(ws, i));

        var html = '<div class="week-nav">' +
          '<button type="button" class="pill-btn on-dark" id="wk-prev" aria-label="Previous week">&#8249;</button>' +
          '<div><h2 class="font-journal">Weekly Reflection</h2><p class="sub">Week of ' + esc(formatShort(ws)) + "</p></div>" +
          '<button type="button" class="pill-btn on-dark" id="wk-next" aria-label="Next week">&#8250;</button></div>' +
          '<p class="dim-text on-dark-dim" style="margin-top:1rem">A week of prayers can look ordinary day by day and remarkable all together. Use this page at the end of each week to look back before you look ahead.</p>';

        html += '<div class="card" style="margin-top:1rem"><div class="stack">' +
          field("w-thankful", "This week, I am most thankful for", form.thankful) +
          field("w-answers", "Answers and small mercies I noticed", form.answers) +
          field("w-teaching", "What God has been teaching me", form.teaching) +
          field("w-waiting", "What I am still waiting for", form.waiting) +
          field("w-nextWeekPrayer", "My prayer for next week", form.nextWeekPrayer) +
          "</div></div>";

        html += '<section class="sec" aria-label="A week of gratitude">' +
          '<h3 class="font-journal on-dark-title" style="font-size:1.25rem">A Week of Gratitude</h3>' + goldRule() +
          '<p class="dim-text on-dark-dim">Thanksgiving is a prayer all by itself. Each day this week, write three things — big or small — that you are grateful for.</p>' +
          '<div class="stack" style="margin-top:0.75rem">' +
          days.map(function (d, i) {
            var g = gratForm(d);
            return '<div class="item-card" style="margin-bottom:0">' + label(WEEKDAY_FULL[i] + " — " + formatShort(d)) +
              '<div class="stack" style="margin-top:0.25rem">' +
              ["item1", "item2", "item3"].map(function (k, j) {
                return '<input class="line-input" id="wg-' + d + "-" + k + '" aria-label="' + WEEKDAY_FULL[i] + " gratitude " + (j + 1) + '" value="' + esc(g[k]) + '" />';
              }).join("") + "</div></div>";
          }).join("") + "</div></section>";

        view.innerHTML = html;
        document.getElementById("wk-prev").addEventListener("click", function () { state.weekStart = addDays(ws, -7); renderWeekly(); });
        document.getElementById("wk-next").addEventListener("click", function () { state.weekStart = addDays(ws, 7); renderWeekly(); });
        bindField("w-thankful", form, "thankful");
        bindField("w-answers", form, "answers");
        bindField("w-teaching", form, "teaching");
        bindField("w-waiting", form, "waiting");
        bindField("w-nextWeekPrayer", form, "nextWeekPrayer");
        days.forEach(function (d) {
          var g = gratForm(d);
          ["item1", "item2", "item3"].forEach(function (k) { bindField("wg-" + d + "-" + k, g, k); });
        });
        saveJournal();
      }

      /* ============ Focus tab ============ */
      function renderFocus() {
        var f = state.focus;
        var html = "";

        html += '<section class="sec" aria-label="Welcome">' +
          '<h2 class="font-journal on-dark-title" style="font-size:1.5rem">Welcome — Your Quiet Place to Pray</h2>' + goldRule() +
          '<p class="body-text on-dark-title" style="color:var(--header-text)">' + esc(WELCOME_TEXT) + "</p></section>";

        html += '<section class="sec" aria-label="The 30-day journey">' +
          '<h3 class="font-journal on-dark-title" style="font-size:1.25rem">The 30-Day Journey</h3>' + goldRule() +
          (state.cycleStart
            ? '<p class="body-text" style="color:var(--header-text)">Day 1 began on ' + esc(formatShort(state.cycleStart)) + ". Today is Day " + cycleDayFor(todayKey(), state.cycleStart) + " of the cycle, and the 30 prompts begin again every 30 days.</p>"
            : '<p class="body-text" style="color:var(--header-text)">The journey has not begun yet. Choose the day your Day 1 falls on — today is a good day to start.</p>') +
          '<div class="form-card"><div class="stack">' +
          '<div>' + label("Day 1 — cycle start date") + '<input type="date" class="journal" id="cycle-start" aria-label="Cycle start date" value="' + (state.cycleStart || todayKey()) + '" /></div>' +
          '<div class="row-actions"><button type="button" class="cta-btn" id="cycle-set">Set start date</button>' +
          '<button type="button" class="link-btn" id="cycle-today">Begin again today</button></div>' +
          "</div></div></section>";

        html += '<section class="sec" aria-label="My prayer focus for this season">' +
          '<h3 class="font-journal on-dark-title" style="font-size:1.25rem">My Prayer Focus for This Season</h3>' + goldRule() +
          '<p class="dim-text on-dark-dim">Naming what you are praying for helps you recognise the answer when it comes — and sometimes the answer looks different, and better, than the one you imagined.</p>' +
          '<div class="form-card"><div class="stack">' +
          field("fo-season", "My prayer for this season", f.seasonPrayer, 2) +
          field("fo-myself", "For myself", f.myself) +
          field("fo-family", "For my family", f.family) +
          field("fo-work", "For my work and calling", f.work) +
          field("fo-others", "For others I am carrying in prayer", f.others) +
          "</div></div>" +
          '<div style="margin-top:1rem">' + verseBlock(VERSES[2], VERSES[2].use) + "</div></section>";

        html += '<section class="sec" aria-label="Keep it private">' +
          '<h3 class="font-journal on-dark-title" style="font-size:1.25rem">Keep It Private</h3>' + goldRule() +
          '<p class="dim-text on-dark-dim">Your prayers are personal. A 4-digit PIN keeps casual eyes out when someone else picks up your phone. It is a privacy screen, not a lock on a safe — and because everything lives only on this phone, there is no "forgot PIN" email: if you forget the PIN, the only way back in is to reset the app, so keep a backup of your journal first.</p>' +
          '<div class="form-card"><div class="stack">' +
          (state.settings.pinHash
            ? '<p class="body-text">PIN lock is on.</p>' +
              '<div>' + label("New 4-digit PIN") + '<input type="password" class="journal pin-input" id="pin-new" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="New 4-digit PIN" /></div>' +
              '<div>' + label("Confirm new PIN") + '<input type="password" class="journal pin-input" id="pin-confirm" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="Confirm new PIN" /></div>' +
              '<div class="row-actions"><button type="button" class="cta-btn" id="pin-change">Change PIN</button>' +
              '<button type="button" class="link-btn" id="pin-off">Turn off PIN lock</button>' +
              '<button type="button" class="link-btn" id="pin-lock-now">Lock the app now</button></div>'
            : '<div>' + label("Choose a 4-digit PIN") + '<input type="password" class="journal pin-input" id="pin-new" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="Choose a 4-digit PIN" /></div>' +
              '<div>' + label("Confirm PIN") + '<input type="password" class="journal pin-input" id="pin-confirm" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="Confirm PIN" /></div>' +
              '<div class="row-actions"><button type="button" class="cta-btn" id="pin-set">Turn on PIN lock</button></div>') +
          '<p class="small-dim" id="pin-msg">' + esc(pinNotice) + '</p>' +
          "</div></div></section>";

        html += '<section class="sec" aria-label="When you do not know what to pray">';
          '<h3 class="font-journal on-dark-title" style="font-size:1.25rem">When You Do Not Know What to Pray</h3>' + goldRule() +
          '<p class="dim-text on-dark-dim">Some days the words will not come. Borrow these prompts — pick one, pray it in your own words, and let it start the conversation.</p>' +
          '<div class="stack" style="margin-top:0.75rem">' +
          PROMPT_CATEGORIES.map(function (c) {
            return '<div class="item-card" style="margin-bottom:0">' + label(c.title) +
              '<ul style="list-style:none;margin:0.5rem 0 0;padding:0">' +
              c.items.map(function (it) { return '<li class="body-text" style="padding:0.125rem 0"><span style="color:var(--gold);margin-right:0.5rem">&bull;</span>' + esc(it) + "</li>"; }).join("") +
              "</ul></div>";
          }).join("") + "</div>" +
          '<p class="font-journal" style="font-style:italic;color:var(--header-dim);margin-top:1rem">A prayer I want to pray again — write it in your notes below.</p></section>';

        html += '<section class="sec" aria-label="Scripture to pray">' +
          '<h3 class="font-journal on-dark-title" style="font-size:1.25rem">Scripture to Pray</h3>' + goldRule() +
          '<p class="dim-text on-dark-dim">When your own words run out, pray God&rsquo;s Word back to Him. Read a verse slowly, turn it into a prayer in your own words, and write that prayer beside it.</p>' +
          '<div class="stack" style="margin-top:0.75rem">' +
          VERSES.map(function (v) { return verseBlock(v, v.use); }).join("") + "</div></section>";

        html += '<section class="sec" aria-label="Notes and a closing blessing">' +
          '<h3 class="font-journal on-dark-title" style="font-size:1.25rem">Notes and a Closing Blessing</h3>' + goldRule() +
          '<p class="dim-text on-dark-dim">Keep this page for verses you discover, words you hear in prayer, and anything you want to remember on the journey.</p>' +
          '<div class="form-card"><div class="stack">' + field("fo-notes", "My notes", state.notes, 8) + "</div></div>" +
          '<figure class="verse"><blockquote class="font-journal">' + esc(CLOSING_BLESSING) + "</blockquote>" +
          '<figcaption>' + esc(CLOSING_REF) + "</figcaption>" +
          '<p class="body-text" style="margin-top:0.75rem">Thank you for praying with the Daily Word 360 family. Join us each day for a morning devotional, a midday encouragement, and an evening prayer — and keep bringing your whole heart to God. He is listening.</p></figure></section>';

        view.innerHTML = html;
        document.getElementById("cycle-set").addEventListener("click", function () {
          var v = document.getElementById("cycle-start").value;
          if (v) { state.cycleStart = v; renderFocus(); }
        });
        document.getElementById("cycle-today").addEventListener("click", function () {
          state.cycleStart = todayKey(); renderFocus();
        });
        bindField("fo-season", f, "seasonPrayer");
        bindField("fo-myself", f, "myself");
        bindField("fo-family", f, "family");
        bindField("fo-work", f, "work");
        bindField("fo-others", f, "others");
        function pinMsg(t) { var m = document.getElementById("pin-msg"); if (m) m.textContent = t; }
        function readPinPair() {
          var a = document.getElementById("pin-new"), b = document.getElementById("pin-confirm");
          if (!a || !b) return null;
          var x = a.value.trim(), y = b.value.trim();
          if (!/^\d{4}$/.test(x)) { pinMsg("Enter a 4-digit PIN (numbers only)."); return null; }
          if (x !== y) { pinMsg("The two PINs do not match — try again."); return null; }
          return x;
        }
        var pinSet = document.getElementById("pin-set");
        if (pinSet) pinSet.addEventListener("click", function () {
          var p = readPinPair(); if (!p) return;
          state.settings.pinHash = pinHash(p); saveJournal();
          pinNotice = "PIN lock is on. The app will ask for your PIN next time it opens.";
          renderFocus();
        });
        var pinChange = document.getElementById("pin-change");
        if (pinChange) pinChange.addEventListener("click", function () {
          var p = readPinPair(); if (!p) return;
          state.settings.pinHash = pinHash(p); saveJournal();
          pinNotice = "PIN changed.";
          renderFocus();
        });
        var pinOff = document.getElementById("pin-off");
        if (pinOff) pinOff.addEventListener("click", function () {
          if (!window.confirm("Turn off PIN lock? Anyone who opens the app will see your journal.")) return;
          state.settings.pinHash = null; sessionUnlocked = true; saveJournal(); renderFocus();
        });
        var pinLockNow = document.getElementById("pin-lock-now");
        if (pinLockNow) pinLockNow.addEventListener("click", function () { lockApp(); });
        var notesEl = document.getElementById("fo-notes");
        if (notesEl) notesEl.addEventListener("input", function () { state.notes = notesEl.value; saveJournal(); });
        saveJournal();
      }

      /* ============ shell: header, tabs, clock ============ */
      var TABS = [
        { id: "today", label: "Today" },
        { id: "calendar", label: "Calendar" },
        { id: "prayers", label: "Prayers" },
        { id: "weekly", label: "Weekly" },
        { id: "focus", label: "Focus" }
      ];
      var tabbar = document.getElementById("tabbar");
      tabbar.innerHTML = TABS.map(function (t) {
        return '<button type="button" data-tab="' + t.id + '" aria-label="' + t.label + '">' + t.label + "</button>";
      }).join("");
      tabbar.querySelectorAll("[data-tab]").forEach(function (b) {
        b.addEventListener("click", function () {
          state.tab = b.getAttribute("data-tab");
          if (state.tab === "weekly") state.weekStart = mondayOf(state.selectedDate);
          if (state.tab === "calendar") { var d = parseKey(state.selectedDate); state.calCursor = { y: d.getFullYear(), m: d.getMonth() }; }
          render();
          window.scrollTo(0, 0);
        });
      });

      function pickDate(d, goToday) {
        state.selectedDate = d;
        state.followToday = d === todayKey();
        if (goToday) state.tab = "today";
        render();
      }

      function renderHeader() {
        var now = new Date();
        var phase = phaseForHour(now.getHours());
        document.getElementById("hdr-date").textContent = formatLong(state.selectedDate);
        var clockEl = document.getElementById("hdr-clock");
        var clock = now.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
        clockEl.textContent = clock;
        clockEl.setAttribute("aria-label", "Current time " + clock);
        document.getElementById("hdr-phase").textContent =
          phase === "morning" ? "Morning devotional time" : phase === "midday" ? "Midday encouragement time" : "Evening prayer time";
        document.getElementById("hdr-rhythm").innerHTML =
          '<span class="' + (phase === "morning" ? "on" : "") + '">7:00 AM Devotional</span> &middot; ' +
          '<span class="' + (phase === "midday" ? "on" : "") + '">1:00 PM Encouragement</span> &middot; ' +
          '<span class="' + (phase === "evening" ? "on" : "") + '">7:00 PM Prayer</span>';

        var extra = document.getElementById("hdr-extra");
        var html = "";
        if (state.selectedDate !== todayKey()) {
          html += '<div class="viewing-note"><span>You are viewing another day.</span>' +
            '<button type="button" class="pill-btn on-dark gold-outline" id="back-today">Back to today</button></div>';
        }
        if (state.tab === "today") {
          html += '<div class="day-nav">' +
            '<button type="button" class="pill-btn on-dark" id="day-prev" aria-label="Previous day">&#8249; Day</button>' +
            '<button type="button" class="pill-btn on-dark" id="day-next" aria-label="Next day">Day &#8250;</button></div>';
        }
        extra.innerHTML = html;
        var back = document.getElementById("back-today");
        if (back) back.addEventListener("click", function () { pickDate(todayKey(), false); });
        var prev = document.getElementById("day-prev");
        if (prev) prev.addEventListener("click", function () { pickDate(addDays(state.selectedDate, -1), false); });
        var next = document.getElementById("day-next");
        if (next) next.addEventListener("click", function () { pickDate(addDays(state.selectedDate, 1), false); });
      }

      function render() {
        tabbar.querySelectorAll("[data-tab]").forEach(function (b) {
          if (b.getAttribute("data-tab") === state.tab) b.setAttribute("aria-current", "page");
          else b.removeAttribute("aria-current");
        });
        renderHeader();
        if (state.tab === "today") renderToday();
        else if (state.tab === "calendar") renderCalendar();
        else if (state.tab === "prayers") renderPrayers();
        else if (state.tab === "weekly") renderWeekly();
        else if (state.tab === "focus") renderFocus();
        saveJournal();
      }

      /* Live clock: tick every second; roll the view over at midnight. */
      var lastToday = todayKey();
      setInterval(function () {
        var t = todayKey();
        if (t !== lastToday) {
          lastToday = t;
          if (state.followToday) { state.selectedDate = t; render(); return; }
        }
        renderHeader();
      }, 1000);

      render();
      wireMusicBar();
      if (state.settings.pinHash) showLockScreen();
    </script>
  </body>
</html>
